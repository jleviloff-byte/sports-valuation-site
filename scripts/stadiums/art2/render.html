<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>venue render</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">
{ "imports": {
  "three": "/node_modules/three/build/three.module.js",
  "three/addons/": "/node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three'
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js'
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js'
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js'
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js'
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js'
import * as K from './kit.js'
import { BUILDERS } from './venues.js'

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true })
renderer.setPixelRatio(1)
renderer.outputColorSpace = THREE.SRGBColorSpace
renderer.shadowMap.enabled = true
renderer.shadowMap.type = THREE.PCFSoftShadowMap
renderer.toneMapping = THREE.NeutralToneMapping
renderer.toneMappingExposure = 1.0
// Soft image-based fill so glass and steel reflect a sky instead of black.
const envTex = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture
document.body.appendChild(renderer.domElement)

// One camera for every venue: 3/4 aerial from the south-southeast.
const CAM_BEARING = 160, CAM_ELEV = 38, FOV = 20
function fitCamera(obj, aspect) {
  // Builders may name a framing region (e.g. racetracks: grandstand and banking) instead of the whole model.
  let box = new THREE.Box3().setFromObject(obj)
  if (obj.userData.frame) {
    box = new THREE.Box3()
    for (const [x, z] of obj.userData.frame) { box.expandByPoint(new THREE.Vector3(x, 0, z)); box.expandByPoint(new THREE.Vector3(x, 60, z)) }
  }
  const sphere = box.getBoundingSphere(new THREE.Sphere())
  const cam = new THREE.PerspectiveCamera(FOV, aspect, 1, 20000)
  const [bx, bz] = K.bearingVec(obj.userData.cameraBearing ?? CAM_BEARING)
  const el = ((obj.userData.cameraElev ?? CAM_ELEV) * Math.PI) / 180
  const dist = (sphere.radius / Math.sin(((FOV / 2) * Math.PI) / 180)) * 1.02
  cam.position.set(sphere.center.x + bx * Math.cos(el) * dist, sphere.center.y + Math.sin(el) * dist, sphere.center.z + bz * Math.cos(el) * dist)
  cam.lookAt(sphere.center)
  cam.updateMatrixWorld()
  // Tighten the framing to the projected bounds so models fill the canvas.
  // Project the frame points themselves (an axis-aligned box around a diagonal
  // frame would pull in everything beside it), else the model's box corners.
  const corners = []
  if (obj.userData.frame) for (const [x, z] of obj.userData.frame) for (const y of [0, 60]) corners.push(new THREE.Vector3(x, y, z).project(cam))
  else for (const x of [box.min.x, box.max.x]) for (const y of [box.min.y, box.max.y]) for (const z of [box.min.z, box.max.z]) corners.push(new THREE.Vector3(x, y, z).project(cam))
  const xs = corners.map((p) => p.x), ys = corners.map((p) => p.y)
  const cx = (Math.max(...xs) + Math.min(...xs)) / 2, cy = (Math.max(...ys) + Math.min(...ys)) / 2
  const hx = Math.max(...xs) - cx, hy = Math.max(...ys) - cy
  // Framed venues (long grandstands) render at their own aspect ratio; the
  // compositor pads to a square with transparent margins.
  const A = obj.userData.frame ? Math.min(2.4, Math.max(1, hx / hy)) : 1
  cam.aspect = A
  const ext = Math.max(hx / A, hy)
  cam.zoom = 1 / (ext * 1.04)
  cam.updateProjectionMatrix()
  cam.userData.aspect = A
  // Shift the image so the model's projected bounds are centered.
  const e = cam.projectionMatrix.elements
  e[8] += (cx / cam.aspect) * cam.zoom
  e[9] += cy * cam.zoom
  cam.projectionMatrixInverse.copy(cam.projectionMatrix).invert()
  return cam
}

// Afternoon light: warm sun from the southwest (behind the camera's left) at 40 degrees, cool sky fill.
// The sun keeps the same position relative to the camera for every venue
// (58 degrees clockwise of the camera bearing), so venues with their own
// camera bearing are lit the same way on screen.
function lights(scene, style, radius, center, camBearing = CAM_BEARING) {
  const sun = new THREE.DirectionalLight(style === 'vector' ? 0xfff1dc : 0xfff7ee, style === 'vector' ? 2.2 : 3.4)
  const [sx, sz] = K.bearingVec(camBearing + 58)
  const el = (40 * Math.PI) / 180
  sun.position.set(center.x + sx * Math.cos(el) * radius * 2, center.y + Math.sin(el) * radius * 2, center.z + sz * Math.cos(el) * radius * 2)
  sun.target.position.copy(center)
  sun.castShadow = style !== 'vector'
  sun.shadow.mapSize.set(4096, 4096)
  const s = sun.shadow.camera
  s.left = s.bottom = -radius * 1.2; s.right = s.top = radius * 1.2; s.near = 1; s.far = radius * 5
  sun.shadow.bias = -0.0002
  sun.shadow.normalBias = 0.4
  sun.shadow.radius = 6
  sun.shadow.blurSamples = 16
  scene.add(sun, sun.target)
  scene.add(new THREE.HemisphereLight(0xd6e4ff, 0x8d8b85, style === 'vector' ? 1.5 : 0.55))
  const fill = new THREE.DirectionalLight(0xb9cdf0, 0.45)
  fill.position.set(center.x - sx * radius, center.y + radius, center.z - sz * radius)
  scene.add(fill)
}

window.renderVenue = async (slug, style, footprint, info, size = 2048) => {
  const mat = K.makeMaterials(style)
  const fp = K.project(footprint)
  const model = BUILDERS[slug]({ fp, kit: K, mat, THREE, info: info || {} })
  const scene = new THREE.Scene()
  scene.background = new THREE.Color(0x000000)
  scene.environment = style === 'vector' ? null : envTex
  scene.environmentIntensity = 0.3
  scene.add(model)
  const box = new THREE.Box3().setFromObject(model)
  const sphere = box.getBoundingSphere(new THREE.Sphere())
  lights(scene, style, sphere.radius, sphere.center, model.userData.cameraBearing ?? CAM_BEARING)
  // Ground plane that only receives shadow (kept out of the mask pass).
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(sphere.radius * 6, sphere.radius * 6), new THREE.ShadowMaterial({ opacity: 0.0 }))
  ground.rotation.x = -Math.PI / 2
  ground.position.set(sphere.center.x, Math.min(0, box.min.y) - 0.01, sphere.center.z)
  const cam = fitCamera(model, 1)
  const H = Math.round(size / cam.userData.aspect)
  renderer.setSize(size, H)
  const out = {}

  // Color pass (with ambient occlusion for the shaded styles).
  if (style === 'vector') {
    renderer.render(scene, cam)
  } else {
    const composer = new EffectComposer(renderer)
    composer.setSize(size, H)
    composer.addPass(new RenderPass(scene, cam))
    const ao = new GTAOPass(scene, cam, size, H)
    ao.updateGtaoMaterial({ radius: sphere.radius * 0.035, distanceExponent: 1.4, thickness: 2, scale: 1.2 })
    ao.blendIntensity = style === 'painted' ? 0.75 : 1.0
    composer.addPass(ao)
    composer.addPass(new OutputPass())
    composer.render()
  }
  out.color = renderer.domElement.toDataURL('image/png')
  out.fadeEdges = !!model.userData.fadeEdges

  // Mask pass: silhouette in white (no tone mapping, so white stays 1.0).
  const prevBg = scene.background
  const prevTM = renderer.toneMapping
  renderer.toneMapping = THREE.NoToneMapping
  scene.overrideMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide })
  const hidden = []
  scene.traverse((o) => { if (o.isLight) { hidden.push(o); o.visible = false } })
  renderer.render(scene, cam)
  out.mask = renderer.domElement.toDataURL('image/png')
  // Normal pass for outline detection.
  scene.overrideMaterial = new THREE.MeshNormalMaterial({ side: THREE.DoubleSide })
  renderer.render(scene, cam)
  out.normal = renderer.domElement.toDataURL('image/png')
  // Depth pass (near = white) for ControlNet conditioning: tight near/far
  // around the model so the gradient spans the venue, not the whole frustum.
  const dc = cam.position.distanceTo(sphere.center)
  const dNear = Math.max(1, dc - sphere.radius * 1.05), dFar = dc + sphere.radius * 1.05
  scene.overrideMaterial = new THREE.ShaderMaterial({
    side: THREE.DoubleSide,
    uniforms: { near: { value: dNear }, far: { value: dFar } },
    vertexShader: 'varying float vz; void main(){ vec4 mv = modelViewMatrix * vec4(position,1.0); vz = -mv.z; gl_Position = projectionMatrix * mv; }',
    fragmentShader: 'uniform float near; uniform float far; varying float vz; void main(){ float d = 1.0 - clamp((vz-near)/(far-near),0.0,1.0); gl_FragColor = vec4(vec3(d),1.0); }',
  })
  renderer.render(scene, cam)
  out.depth = renderer.domElement.toDataURL('image/png')
  scene.overrideMaterial = null
  hidden.forEach((o) => { o.visible = true })
  scene.background = prevBg
  renderer.toneMapping = prevTM
  return out
}
window.ready = true
</script>
</body>
</html>
